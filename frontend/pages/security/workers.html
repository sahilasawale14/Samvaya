<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporary Workers — SAMVAYA Security</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/security.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">Temporary Construction & Maintenance Workers</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Track carpenters, painters, plumbers, and contractors working inside society</p>
            </div>
          </div>
          <div id="security-workers-table"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['SECURITY_GUARD', 'ADMIN'])) {
        Sidebar.render('sidebar-container', 'workers');
        Navbar.render('navbar-container', 'Temporary Workers');

        const workers = [
          { name: 'Kalu Ram', workType: 'CARPENTRY', flat: 'Wing A-101', contractor: 'Livspace Interiors', passCode: 'WRK-2026-9901', status: 'INSIDE' },
          { name: 'Vijay Suthar', workType: 'PAINTING', flat: 'Wing B-202', contractor: 'Asian Paints Pro', passCode: 'WRK-2026-9902', status: 'INSIDE' }
        ];

        Table.render('security-workers-table', [
          { label: 'Worker Name', render: r => `<b>${r.name}</b>` },
          { label: 'Trade / Work Type', render: r => `<span class="badge badge-info">${r.workType}</span>` },
          { label: 'Target Unit', render: r => `<b>${r.flat}</b>` },
          { label: 'Contractor Agency', key: 'contractor' },
          { label: 'Worker Gate Pass', render: r => `<code>${r.passCode}</code>` },
          { label: 'Status', render: r => `<span class="badge badge-success">${r.status}</span>` },
          { label: 'Action', render: r => `<button class="btn btn-ghost" style="color:var(--danger);" onclick="Toast.success('Worker departure logged')">Log Exit</button>` }
        ], workers);
      }
    });
  </script>
</body>
</html>
