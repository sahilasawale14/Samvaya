<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Delivery Check-In — SAMVAYA Security</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/security.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">Delivery & Courier Check-In</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Verify incoming parcels from Amazon, Swiggy, Zomato, Flipkart, Blinkit</p>
            </div>
          </div>
          <div id="all-security-deliveries-table"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/api/api.js"></script>
  <script src="/js/api/securityApi.js"></script>
  <script src="/js/pages/security.js"></script>
  <script>
    async function loadDeliveries() {
      const deliveries = await SecurityApi.getAllDeliveries();
      Table.render('all-security-deliveries-table', [
        { label: 'Platform', render: r => `<b>${r.company}</b>` },
        { label: 'Destination', render: r => `<b>Wing ${r.wing}-${r.flatNumber}</b> (${r.residentName})` },
        { label: 'Courier Agent', render: r => `${r.deliveryPersonName || 'Courier'} (${r.phone || '-'})` },
        { label: 'Order / Ref #', render: r => `<code>${r.referenceNumber}</code>` },
        { label: 'Status', render: r => `<span class="badge ${r.status === 'ARRIVED' ? 'badge-warning' : (r.status === 'COMPLETED' ? 'badge-success' : 'badge-info')}">${r.status}</span>` },
        { label: 'Actions', render: r => `
          ${r.status === 'EXPECTED' ? `<button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="SecurityPage.markDeliveryArrival(${r.id}); loadDeliveries();">At Gate</button>` : ''}
          ${r.status === 'ARRIVED' ? `<button class="btn btn-primary" style="padding:4px 8px; font-size:11px;" onclick="SecurityPage.completeDelivery(${r.id}); loadDeliveries();">Handover</button>` : ''}
          ${r.status === 'COMPLETED' ? `<span style="color:var(--success); font-size:12px;">✓ Completed</span>` : ''}
        `}
      ], deliveries);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['SECURITY_GUARD', 'ADMIN'])) {
        Sidebar.render('sidebar-container', 'deliveries');
        Navbar.render('navbar-container', 'Delivery Check-In');
        loadDeliveries();
      }
    });
  </script>
</body>
</html>
