<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Security Incidents — SAMVAYA Security</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/security.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">Security Incident & Breach Reporting</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Report perimeter alarms, unauthorized parking, tailgating, or disturbances</p>
            </div>
            <button class="btn btn-primary" onclick="Modal.open('new-incident-modal')">
              <span class="material-symbols-outlined">add_alert</span> Report Incident
            </button>
          </div>
          <div id="security-incidents-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Incident Modal -->
  <div class="modal-backdrop" id="new-incident-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Log Gate Security Incident</h3>
        <button onclick="Modal.close('new-incident-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form onsubmit="handleIncidentSubmit(event)">
        <div class="modal-body">
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Incident Type</label>
            <select id="inc-type">
              <option value="UNAUTHORIZED_PARKING">UNAUTHORIZED PARKING</option>
              <option value="TAILGATING_ATTEMPT">TAILGATING ATTEMPT AT BARRIER</option>
              <option value="SUSPICIOUS_PERSON">SUSPICIOUS PERSON / PERIMETER</option>
              <option value="GATE_EQUIPMENT_ISSUE">GATE BOOM BARRIER MALFUNCTION</option>
              <option value="NOISE_DISTURBANCE">LATE NIGHT NOISE DISTURBANCE</option>
              <option value="OTHER">OTHER SECURITY CONCERN</option>
            </select>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Location</label>
            <input type="text" id="inc-location" placeholder="e.g. Basement 1 Parking near Wing A" required>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Priority</label>
            <select id="inc-priority">
              <option value="MEDIUM">MEDIUM</option>
              <option value="HIGH">HIGH (Urgent Alert)</option>
              <option value="LOW">LOW</option>
            </select>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Description & Observations</label>
            <textarea id="inc-description" rows="3" placeholder="Describe the incident..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('new-incident-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Incident Report</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/api/api.js"></script>
  <script src="/js/api/securityApi.js"></script>
  <script>
    async function loadIncidents() {
      const incidents = await SecurityApi.getIncidents();
      Table.render('security-incidents-table', [
        { label: 'Incident Type', render: r => `<b>${r.incidentType}</b>` },
        { label: 'Location', key: 'location' },
        { label: 'Details', key: 'description' },
        { label: 'Priority', render: r => `<span class="badge ${r.priority === 'HIGH' ? 'badge-danger' : 'badge-warning'}">${r.priority}</span>` },
        { label: 'Reported By', key: 'reportedByGuardName' },
        { label: 'Status', render: r => `<span class="badge ${r.status === 'RESOLVED' ? 'badge-success' : 'badge-warning'}">${r.status}</span>` }
      ], incidents);
    }

    async function handleIncidentSubmit(event) {
      event.preventDefault();
      const incData = {
        incidentType: document.getElementById('inc-type').value,
        location: document.getElementById('inc-location').value,
        priority: document.getElementById('inc-priority').value,
        description: document.getElementById('inc-description').value
      };
      await SecurityApi.reportIncident(incData);
      Toast.success('Security incident logged');
      Modal.close('new-incident-modal');
      loadIncidents();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['SECURITY'])) {
        Sidebar.render('sidebar-container', 'incidents');
        Navbar.render('navbar-container', 'Incident Reporting');
        loadIncidents();
      }
    });
  </script>
</body>
</html>
