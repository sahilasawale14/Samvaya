<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expected Deliveries — SAMVAYA Resident</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/resident.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">My Parcel & Courier Deliveries</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Track expected packages and verify delivery agents</p>
            </div>
            <button class="btn btn-primary" onclick="Modal.open('new-delivery-modal')">
              <span class="material-symbols-outlined">add</span> Expect New Delivery
            </button>
          </div>
          <div id="deliveries-data-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Delivery Modal -->
  <div class="modal-backdrop" id="new-delivery-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Pre-Register Expected Delivery</h3>
        <button onclick="Modal.close('new-delivery-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form onsubmit="handleDeliverySubmit(event)">
        <div class="modal-body">
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Delivery / Courier Service</label>
            <select id="del-company">
              <option value="Amazon">Amazon</option>
              <option value="Flipkart">Flipkart</option>
              <option value="Swiggy">Swiggy / Instamart</option>
              <option value="Zomato">Zomato / Blinkit</option>
              <option value="BlueDart">Blue Dart Express</option>
              <option value="Other">Other Courier Service</option>
            </select>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Tracking / Order Reference #</label>
            <input type="text" id="del-ref" placeholder="e.g. AMZ-99281-IN" required>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Delivery Agent Name (If known)</label>
            <input type="text" id="del-agent" placeholder="Optional">
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Special Instructions for Gate</label>
            <input type="text" id="del-notes" placeholder="e.g. Leave at gate if not answering">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('new-delivery-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Pre-Register Delivery</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/api/api.js"></script>
  <script src="/js/api/residentApi.js"></script>
  <script>
    async function loadDeliveries() {
      const user = getCurrentUser();
      const residentId = user ? (user.residentId || 1) : 1;
      const deliveries = await ResidentApi.getDeliveries(residentId);
      Table.render('deliveries-data-table', [
        { label: 'Company / Platform', render: r => `<b>${r.company}</b>` },
        { label: 'Tracking #', render: r => `<code>${r.referenceNumber}</code>` },
        { label: 'Delivery Boy', render: r => `${r.deliveryPersonName || 'Courier'} (${r.phone || '-'})` },
        { label: 'Status', render: r => `<span class="badge ${r.status === 'ARRIVED' ? 'badge-warning' : (r.status === 'COMPLETED' ? 'badge-success' : 'badge-info')}">${r.status}</span>` },
        { label: 'Gate Arrival', render: r => r.arrivedAt || '-' },
        { label: 'Completed At', render: r => r.completedAt || '-' },
        { label: 'Instructions', render: r => r.notes || '-' }
      ], deliveries);
    }

    async function handleDeliverySubmit(event) {
      event.preventDefault();
      const user = getCurrentUser();
      const residentId = user ? (user.residentId || 1) : 1;
      const deliveryData = {
        residentId: residentId,
        company: document.getElementById('del-company').value,
        referenceNumber: document.getElementById('del-ref').value,
        deliveryPersonName: document.getElementById('del-agent').value,
        notes: document.getElementById('del-notes').value
      };
      await ResidentApi.createExpectedDelivery(deliveryData);
      Toast.success('Delivery pre-registered!');
      Modal.close('new-delivery-modal');
      loadDeliveries();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['RESIDENT'])) {
        Sidebar.render('sidebar-container', 'deliveries');
        Navbar.render('navbar-container', 'Expected Deliveries');
        loadDeliveries();
      }
    });
  </script>
</body>
</html>
