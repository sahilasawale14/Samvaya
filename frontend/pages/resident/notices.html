<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Society Notices — SAMVAYA Resident</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/resident.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">Society Notices & Announcements</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Latest circulars from the Managing Committee</p>
            </div>
          </div>
          <div id="resident-notices-table"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/api/api.js"></script>
  <script src="/js/api/residentApi.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (checkAuth(['RESIDENT'])) {
        Sidebar.render('sidebar-container', 'notices');
        Navbar.render('navbar-container', 'Notices & Circulars');

        const notices = await ResidentApi.getNotices();
        Table.render('resident-notices-table', [
          { label: 'Notice Title', render: r => `<b>${r.title}</b><br><small style="color:var(--on-surface-variant);">${r.content}</small>` },
          { label: 'Category', key: 'category' },
          { label: 'Priority', render: r => `<span class="badge ${r.priority === 'HIGH' ? 'badge-danger' : 'badge-info'}">${r.priority}</span>` },
          { label: 'Date Published', key: 'publishedDate' }
        ], notices);
      }
    });
  </script>
</body>
</html>
