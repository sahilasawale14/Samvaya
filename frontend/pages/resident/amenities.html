<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amenities & Booking — SAMVAYA Resident</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/resident.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <!-- Amenities Cards -->
        <h2 style="font-size:20px; font-weight:700; margin-bottom:16px;">Society Amenities Showcase</h2>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; margin-bottom:32px;" id="amenities-cards-grid"></div>

        <!-- My Bookings Table -->
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">My Facility Reservations</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Track your confirmed slots and cancellation policies</p>
            </div>
          </div>
          <div id="resident-bookings-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Amenity Booking Modal -->
  <div class="modal-backdrop" id="amenity-booking-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Book Amenity Slot</h3>
        <button onclick="Modal.close('amenity-booking-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form onsubmit="ResidentPage.submitAmenityBooking(event)">
        <div class="modal-body">
          <input type="hidden" id="booking-amenity-id">
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Facility Name</label>
            <input type="text" id="booking-amenity-name" readonly style="background:var(--surface-container-low); font-weight:700;">
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Booking Date</label>
            <input type="date" id="booking-date" required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Start Time</label>
              <input type="time" id="booking-start-time" value="18:00" required>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">End Time</label>
              <input type="time" id="booking-end-time" value="20:00" required>
            </div>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Number of Guests / Attendees</label>
            <input type="number" id="booking-guests" value="4" min="1" max="50">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('amenity-booking-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Confirm Reservation</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/api/api.js"></script>
  <script src="/js/api/residentApi.js"></script>
  <script src="/js/pages/resident.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['RESIDENT'])) {
        document.getElementById('booking-date').value = new Date().toISOString().split('T')[0];
        ResidentPage.initAmenities();
      }
    });
  </script>
</body>
</html>
