<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visitor Passes — SAMVAYA Resident</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/resident.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">My Expected Visitors & Guest Passes</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Generate instant passcodes and approve arrivals at the security gate</p>
            </div>
            <button class="btn btn-primary" onclick="Modal.open('new-visitor-modal')">
              <span class="material-symbols-outlined">add</span> Create Visitor Pass
            </button>
          </div>
          <div id="visitors-data-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Visitor Modal -->
  <div class="modal-backdrop" id="new-visitor-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Create Visitor Pre-Approval Pass</h3>
        <button onclick="Modal.close('new-visitor-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form onsubmit="ResidentPage.createVisitorPassSubmit(event)">
        <div class="modal-body">
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Visitor Full Name</label>
            <input type="text" id="visitor-name" placeholder="e.g. Anand Mahindra" required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Visitor Phone</label>
              <input type="text" id="visitor-phone" placeholder="+91 98000 11111" required>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Number of Guests</label>
              <input type="number" id="visitor-count" value="1" min="1" max="10">
            </div>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Purpose of Visit</label>
            <input type="text" id="visitor-purpose" placeholder="e.g. Dinner & Family Gathering" required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Expected Date</label>
              <input type="date" id="visitor-date" required>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Expected Time</label>
              <input type="time" id="visitor-time" required>
            </div>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Vehicle Number (Optional)</label>
            <input type="text" id="visitor-vehicle" placeholder="e.g. MH 02 AB 1234">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('new-visitor-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Generate Pass</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/api/api.js"></script>
  <script src="/js/api/residentApi.js"></script>
  <script src="/js/pages/resident.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['RESIDENT'])) {
        document.getElementById('visitor-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('visitor-time').value = "18:00";
        ResidentPage.initVisitors();
      }
    });
  </script>
</body>
</html>
