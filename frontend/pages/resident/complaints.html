<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Complaints & Helpdesk — SAMVAYA Resident</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/resident.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">My Maintenance Tickets & Issues</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Raise maintenance requests for plumbing, electrical, leakage, or common area issues</p>
            </div>
            <button class="btn btn-primary" onclick="Modal.open('new-complaint-modal')">
              <span class="material-symbols-outlined">add</span> Raise Complaint
            </button>
          </div>
          <div id="resident-complaints-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Complaint Modal -->
  <div class="modal-backdrop" id="new-complaint-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Raise Maintenance Complaint</h3>
        <button onclick="Modal.close('new-complaint-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form onsubmit="ResidentPage.createComplaintSubmit(event)">
        <div class="modal-body">
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Category</label>
            <select id="comp-category">
              <option value="PLUMBING">PLUMBING</option>
              <option value="ELECTRICAL">ELECTRICAL</option>
              <option value="SEEPAGE_LEAKAGE">SEEPAGE / LEAKAGE</option>
              <option value="LIFT_ELEVATOR">LIFT / ELEVATOR</option>
              <option value="CLEANLINESS">CLEANLINESS / HOUSEKEEPING</option>
              <option value="SECURITY">SECURITY</option>
              <option value="NOISE">NOISE COMPLAINT</option>
              <option value="OTHER">OTHER</option>
            </select>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Issue Title</label>
            <input type="text" id="comp-title" placeholder="e.g. Master Bedroom Geyser Tripping" required>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Priority</label>
            <select id="comp-priority">
              <option value="MEDIUM">MEDIUM</option>
              <option value="HIGH">HIGH (Urgent)</option>
              <option value="LOW">LOW</option>
            </select>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Detailed Description</label>
            <textarea id="comp-description" rows="3" placeholder="Explain the problem in detail..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('new-complaint-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/api/api.js"></script>
  <script src="/js/api/residentApi.js"></script>
  <script src="/js/pages/resident.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['RESIDENT'])) {
        ResidentPage.initComplaints();
      }
    });
  </script>
</body>
</html>
