<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Amenities Management — SAMVAYA Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">Society Amenities Overview</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Clubhouse Lounge, Swimming Pool, Rooftop Garden, Gym, Banquet Hall</p>
            </div>
            <button class="btn btn-primary" onclick="Modal.open('new-amenity-modal')">
              <span class="material-symbols-outlined">add</span> Add New Amenity
            </button>
          </div>
          <div id="admin-amenities-table"></div>
        </div>

        <div class="card-section">
          <div class="card-header-flex">
            <h2 class="card-title">Active Amenity Reservations</h2>
          </div>
          <div id="admin-bookings-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Amenity Modal -->
  <div class="modal-backdrop" id="new-amenity-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Add Society Amenity</h3>
        <button onclick="Modal.close('new-amenity-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form onsubmit="handleAmenitySubmit(event)">
        <div class="modal-body">
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Facility Name</label>
            <input type="text" id="amenity-name" placeholder="e.g. Squash Court & Arena" required>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Description</label>
            <input type="text" id="amenity-desc" placeholder="Details, features, equipment..." required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Capacity (Persons)</label>
              <input type="number" id="amenity-capacity" value="20" min="1" required>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Hourly Rate (₹)</label>
              <input type="number" id="amenity-rate" value="0" min="0" required>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Opening Time</label>
              <input type="time" id="amenity-open" value="06:00" required>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Closing Time</label>
              <input type="time" id="amenity-close" value="22:00" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('new-amenity-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Amenity</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/components/toast.js?v=3"></script>
  <script src="/js/components/modal.js?v=3"></script>
  <script src="/js/components/sidebar.js?v=3"></script>
  <script src="/js/components/navbar.js?v=3"></script>
  <script src="/js/components/table.js?v=3"></script>
  <script src="/js/api/api.js?v=3"></script>
  <script src="/js/api/adminApi.js?v=3"></script>
  <script>
    async function loadAmenities() {
      const amenities = await AdminApi.getAmenities();
      const bookings = await AdminApi.getBookings();

      Table.render('admin-amenities-table', [
        { label: 'Facility Name', render: r => `<b>${r.name}</b>` },
        { label: 'Description', key: 'description' },
        { label: 'Capacity', render: r => `${r.capacity} Persons` },
        { label: 'Timings', render: r => `${r.openTime} - ${r.closeTime}` },
        { label: 'Hourly Rate', render: r => r.hourlyRate > 0 ? `₹${r.hourlyRate}/hr` : 'Free' },
        { label: 'Status', render: r => `<span class="badge badge-success">Active</span>` }
      ], amenities);

      Table.render('admin-bookings-table', [
        { label: 'Facility', key: 'amenityName' },
        { label: 'Booked By', key: 'residentName' },
        { label: 'Unit', render: r => `Wing ${r.wing}-${r.flatNumber}` },
        { label: 'Booking Date', key: 'bookingDate' },
        { label: 'Time Slot', render: r => `${r.startTime} - ${r.endTime}` },
        { label: 'Guests', key: 'numberOfGuests' },
        { label: 'Amount', render: r => r.totalAmount > 0 ? `₹${r.totalAmount}` : 'Free' },
        { label: 'Status', render: r => `<span class="badge badge-success">${r.status}</span>` }
      ], bookings);
    }

    async function handleAmenitySubmit(event) {
      event.preventDefault();
      const amenityData = {
        name: document.getElementById('amenity-name').value,
        description: document.getElementById('amenity-desc').value,
        capacity: parseInt(document.getElementById('amenity-capacity').value),
        hourlyRate: parseFloat(document.getElementById('amenity-rate').value),
        openTime: document.getElementById('amenity-open').value + ':00',
        closeTime: document.getElementById('amenity-close').value + ':00'
      };

      await AdminApi.createAmenity(amenityData);
      Toast.success('New amenity saved to database!');
      Modal.close('new-amenity-modal');
      loadAmenities();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (checkAuth(['ADMIN'])) {
        Sidebar.render('sidebar-container', 'amenities');
        Navbar.render('navbar-container', 'Amenities & Bookings');
        loadAmenities();
      }
    });
  </script>
</body>
</html>
