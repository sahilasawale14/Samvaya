<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Society Notices — SAMVAYA Admin</title>
  <link rel="stylesheet" href="/css/main.css?v=3">
  <link rel="stylesheet" href="/css/dashboard.css?v=3">
  <link rel="stylesheet" href="/css/admin.css?v=3">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">Published Society Notices & Circulars</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Official announcements, maintenance schedules, and AGM updates</p>
            </div>
            <button class="btn btn-primary" onclick="Modal.open('new-notice-modal')">
              <span class="material-symbols-outlined">add</span> Publish Notice
            </button>
          </div>
          <div id="admin-notices-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Notice Modal -->
  <div class="modal-backdrop" id="new-notice-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Publish New Society Notice</h3>
        <button onclick="Modal.close('new-notice-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form onsubmit="handleNoticeSubmit(event)">
        <div class="modal-body">
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Notice Title</label>
            <input type="text" id="notice-title" placeholder="e.g. Water Tank Cleaning Schedule" required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Category</label>
              <select id="notice-category">
                <option value="GENERAL">GENERAL</option>
                <option value="MAINTENANCE">MAINTENANCE</option>
                <option value="WATER_SUPPLY">WATER_SUPPLY</option>
                <option value="EVENT">EVENT</option>
                <option value="SECURITY">SECURITY</option>
                <option value="RULES">RULES</option>
              </select>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Priority</label>
              <select id="notice-priority">
                <option value="MEDIUM">MEDIUM</option>
                <option value="HIGH">HIGH (Urgent Alert)</option>
                <option value="LOW">LOW</option>
              </select>
            </div>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Content / Details</label>
            <textarea id="notice-content" rows="4" placeholder="Detailed announcement body..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('new-notice-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish to All Residents</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/components/toast.js?v=3"></script>
  <script src="/js/components/modal.js?v=3"></script>
  <script src="/js/components/sidebar.js?v=3"></script>
  <script src="/js/components/navbar.js?v=3"></script>
  <script src="/js/components/table.js?v=3"></script>
  <script src="/js/api/api.js?v=3"></script>
  <script src="/js/api/adminApi.js?v=3"></script>
  <script>
    async function loadNotices() {
      try {
        const notices = await AdminApi.getNotices();
        Table.render('admin-notices-table', [
          { label: 'Title & Content', render: r => `
            <b>${r.title}</b><br>
            <small style="color:var(--on-surface-variant); line-height:1.4;">${r.content}</small>
          ` },
          { label: 'Category', key: 'category' },
          { label: 'Priority', render: r => `<span class="badge ${r.priority === 'HIGH' ? 'badge-danger' : 'badge-info'}">${r.priority}</span>` },
          { label: 'Published Date', key: 'publishedDate' },
          { label: 'Actions', render: r => `
            <button class="btn btn-ghost" style="color:var(--danger); padding:4px 8px; font-size:12px; display:inline-flex; align-items:center; gap:4px;" onclick="deleteNoticeById(${r.id})">
              <span class="material-symbols-outlined" style="font-size:16px;">delete</span> Delete Notice
            </button>
          `}
        ], notices);
      } catch (err) {
        console.error('Error loading notices:', err);
      }
    }

    async function handleNoticeSubmit(event) {
      event.preventDefault();
      const noticeData = {
        title: document.getElementById('notice-title').value.trim(),
        category: document.getElementById('notice-category').value,
        priority: document.getElementById('notice-priority').value,
        content: document.getElementById('notice-content').value.trim(),
        publishedDate: new Date().toISOString().split('T')[0]
      };
      
      try {
        await AdminApi.createNotice(noticeData);
        Toast.success('Notice published to all residents in database!');
        Modal.close('new-notice-modal');
        loadNotices();
      } catch (err) {
        // Handled by toast
      }
    }

    function deleteNoticeById(id) {
      if (window.Modal && typeof window.Modal.confirm === 'function') {
        window.Modal.confirm({
          title: 'Delete Society Notice?',
          message: 'This notice circular will be permanently removed from all resident dashboards and database.',
          confirmText: 'Delete Notice',
          danger: true,
          onConfirm: async () => {
            try {
              await AdminApi.deleteNotice(id);
              Toast.success('Notice deleted from database!');
              loadNotices();
            } catch (err) {
              Toast.error('Failed to delete notice');
            }
          }
        });
      } else {
        if (confirm('Are you sure you want to permanently delete this notice?')) {
          AdminApi.deleteNotice(id).then(() => {
            Toast.success('Notice deleted from database!');
            loadNotices();
          });
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['ADMIN'])) {
        Sidebar.render('sidebar-container', 'notices');
        Navbar.render('navbar-container', 'Notices & Circulars');
        loadNotices();
      }
    });
  </script>
</body>
</html>
