<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>User Accounts Management — SAMVAYA Admin</title>
  <link rel="stylesheet" href="/css/main.css?v=3">
  <link rel="stylesheet" href="/css/dashboard.css?v=3">
  <link rel="stylesheet" href="/css/admin.css?v=3">
  <style>
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--surface-container-low);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .kpi-owner { background: rgba(0, 106, 99, 0.12); color: var(--primary); }
    .kpi-tenant { background: rgba(229, 93, 50, 0.12); color: var(--accent); }
    .kpi-guard { background: rgba(3, 7, 37, 0.08); color: var(--secondary); }
    .kpi-admin { background: rgba(186, 26, 26, 0.12); color: var(--danger); }
    
    .badge-owner {
      background: #e6f4ea;
      color: #137333;
      font-weight: 700;
      border: 1px solid #ceead6;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
    .badge-tenant {
      background: #fef7e0;
      color: #b06000;
      font-weight: 700;
      border: 1px solid #feefc3;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
    .badge-guard {
      background: #e8eaed;
      color: #202124;
      font-weight: 700;
      border: 1px solid #dadce0;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
    .badge-admin {
      background: #fce8e6;
      color: #c5221f;
      font-weight: 700;
      border: 1px solid #fad2cf;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <!-- KPI Summary Cards -->
        <div class="kpi-row">
          <div class="kpi-card">
            <div class="kpi-icon kpi-owner">
              <span class="material-symbols-outlined">real_estate_agent</span>
            </div>
            <div>
              <div style="font-size:12px; font-weight:600; color:var(--on-surface-variant); text-transform:uppercase;">Property Owners</div>
              <div style="font-size:24px; font-weight:700; color:var(--on-surface);" id="count-owners">0</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon kpi-tenant">
              <span class="material-symbols-outlined">key</span>
            </div>
            <div>
              <div style="font-size:12px; font-weight:600; color:var(--on-surface-variant); text-transform:uppercase;">Registered Tenants</div>
              <div style="font-size:24px; font-weight:700; color:var(--on-surface);" id="count-tenants">0</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon kpi-guard">
              <span class="material-symbols-outlined">security</span>
            </div>
            <div>
              <div style="font-size:12px; font-weight:600; color:var(--on-surface-variant); text-transform:uppercase;">Security Guards</div>
              <div style="font-size:24px; font-weight:700; color:var(--on-surface);" id="count-guards">0</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon kpi-admin">
              <span class="material-symbols-outlined">admin_panel_settings</span>
            </div>
            <div>
              <div style="font-size:12px; font-weight:600; color:var(--on-surface-variant); text-transform:uppercase;">Administrators</div>
              <div style="font-size:24px; font-weight:700; color:var(--on-surface);" id="count-admins">0</div>
            </div>
          </div>
        </div>

        <!-- Table Card -->
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">User Accounts & Roles Registry</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Differentiate and manage Owners, Tenants, Guards, and Society Admins</p>
            </div>
            <button class="btn btn-primary" onclick="openNewUserModal()">
              <span class="material-symbols-outlined">person_add</span> Create User Account
            </button>
          </div>

          <!-- Tab Filters -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
            <div class="filter-tabs">
              <button class="filter-tab active" onclick="filterUserList('ALL', this)">All Accounts</button>
              <button class="filter-tab" onclick="filterUserList('OWNER', this)">🏠 Property Owners</button>
              <button class="filter-tab" onclick="filterUserList('TENANT', this)">🔑 Tenants</button>
              <button class="filter-tab" onclick="filterUserList('GUARD', this)">🛡️ Security Guards</button>
              <button class="filter-tab" onclick="filterUserList('ADMIN', this)">⚙️ Admins</button>
            </div>
          </div>

          <div id="users-data-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create User Modal -->
  <div class="modal-backdrop" id="new-user-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Create New User Account</h3>
        <button onclick="Modal.close('new-user-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form onsubmit="handleCreateUserSubmit(event)">
        <div class="modal-body">
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Full Name</label>
            <input type="text" id="user-fullname" placeholder="e.g. Ramesh Kumar" required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Username</label>
              <input type="text" id="user-username" placeholder="e.g. ramesh101" required>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Password</label>
              <input type="password" id="user-password" placeholder="password123" required>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Email</label>
              <input type="email" id="user-email" placeholder="user@samvaya.com" required>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Phone</label>
              <input type="text" id="user-phone" placeholder="+91 98000 00000">
            </div>
          </div>
          
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Account Type & Occupancy</label>
            <select id="user-account-type" onchange="handleAccountTypeChange(this.value)">
              <option value="RESIDENT_OWNER">🏠 Resident — Property Owner</option>
              <option value="RESIDENT_TENANT">🔑 Resident — Registered Tenant</option>
              <option value="SECURITY_GUARD">🛡️ Security Guard — Gate Operator</option>
              <option value="ADMIN">⚙️ System Administrator</option>
            </select>
          </div>

          <div id="resident-flat-container" style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Assign Society Flat / Unit</label>
            <select id="user-flat-id">
              <option value="">Loading flats from database...</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('new-user-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Account in Database</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/components/toast.js?v=3"></script>
  <script src="/js/components/modal.js?v=3"></script>
  <script src="/js/components/sidebar.js?v=3"></script>
  <script src="/js/components/navbar.js?v=3"></script>
  <script src="/js/components/table.js?v=3"></script>
  <script src="/js/api/api.js?v=3"></script>
  <script src="/js/api/authApi.js?v=3"></script>
  <script src="/js/api/adminApi.js?v=3"></script>
  <script>
    let allUsersCache = [];
    let currentFilter = 'ALL';

    function handleAccountTypeChange(accountType) {
      const flatContainer = document.getElementById('resident-flat-container');
      if (flatContainer) {
        flatContainer.style.display = accountType.startsWith('RESIDENT') ? 'block' : 'none';
      }
    }

    async function populateFlatsDropdown() {
      try {
        const flats = await AdminApi.getFlats();
        const select = document.getElementById('user-flat-id');
        if (select && flats && flats.length > 0) {
          select.innerHTML = flats.map(f => `
            <option value="${f.id}">Wing ${f.wing} - Flat ${f.flatNumber} (${f.bhkType} - ${f.status})</option>
          `).join('');
        }
      } catch (err) {
        console.error('Error fetching flats:', err);
      }
    }

    async function openNewUserModal() {
      await populateFlatsDropdown();
      Modal.open('new-user-modal');
    }

    function renderUserTable(users) {
      Table.render('users-data-table', [
        { label: 'Full Name & Username', render: r => `
          <b>${r.fullName}</b><br>
          <small style="color:var(--outline);">@${r.username}</small>
        `},
        { label: 'Occupancy / Role', render: r => {
          if (r.role === 'RESIDENT') {
            if (r.residentType === 'TENANT') {
              return `<span class="badge-tenant">🔑 TENANT</span>`;
            }
            return `<span class="badge-owner">🏠 OWNER</span>`;
          } else if (r.role === 'ADMIN') {
            return `<span class="badge-admin">⚙️ ADMIN</span>`;
          } else if (r.role === 'SECURITY_GUARD') {
            return `<span class="badge-guard">🛡️ GUARD</span>`;
          }
          return `<span class="badge badge-neutral">${r.role}</span>`;
        }},
        { label: 'Assigned Unit', render: r => {
          if (r.wing && r.flatNumber) {
            return `<b>Wing ${r.wing}-${r.flatNumber}</b>`;
          }
          return `<span style="color:var(--outline); font-size:12px;">N/A (Staff/Admin)</span>`;
        }},
        { label: 'Contact Details', render: r => `
          <div>${r.email}</div>
          <small style="color:var(--outline);">${r.phone || '-'}</small>
        `},
        { label: 'Account Status', render: r => `<span class="badge badge-success">${r.isActive ? 'Active' : 'Deactivated'}</span>` }
      ], users);
    }

    function updateKpiCounts(users) {
      let owners = 0, tenants = 0, guards = 0, admins = 0;
      users.forEach(u => {
        if (u.role === 'RESIDENT') {
          if (u.residentType === 'TENANT') tenants++;
          else owners++;
        } else if (u.role === 'ADMIN') {
          admins++;
        } else if (u.role === 'SECURITY_GUARD') {
          guards++;
        }
      });

      document.getElementById('count-owners').innerText = owners;
      document.getElementById('count-tenants').innerText = tenants;
      document.getElementById('count-guards').innerText = guards;
      document.getElementById('count-admins').innerText = admins;
    }

    function filterUserList(filterType, btn) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      let filtered = allUsersCache;
      if (filterType === 'OWNER') {
        filtered = allUsersCache.filter(u => u.role === 'RESIDENT' && u.residentType === 'OWNER');
      } else if (filterType === 'TENANT') {
        filtered = allUsersCache.filter(u => u.role === 'RESIDENT' && u.residentType === 'TENANT');
      } else if (filterType === 'GUARD') {
        filtered = allUsersCache.filter(u => u.role === 'SECURITY_GUARD');
      } else if (filterType === 'ADMIN') {
        filtered = allUsersCache.filter(u => u.role === 'ADMIN');
      }

      renderUserTable(filtered);
    }

    async function loadUsers() {
      try {
        allUsersCache = await AdminApi.getUsers();
        updateKpiCounts(allUsersCache);
        filterUserList(currentFilter);
      } catch (err) {
        console.error('Error loading users:', err);
      }
    }

    async function handleCreateUserSubmit(event) {
      event.preventDefault();
      const accountType = document.getElementById('user-account-type').value;

      let role = 'RESIDENT';
      let residentType = null;

      if (accountType === 'RESIDENT_OWNER') {
        role = 'RESIDENT';
        residentType = 'OWNER';
      } else if (accountType === 'RESIDENT_TENANT') {
        role = 'RESIDENT';
        residentType = 'TENANT';
      } else if (accountType === 'SECURITY_GUARD') {
        role = 'SECURITY_GUARD';
        residentType = null;
      } else if (accountType === 'ADMIN') {
        role = 'ADMIN';
        residentType = null;
      }

      const flatSelect = document.getElementById('user-flat-id');
      const flatId = (role === 'RESIDENT' && flatSelect.value) ? parseInt(flatSelect.value) : null;

      const userData = {
        fullName: document.getElementById('user-fullname').value,
        username: document.getElementById('user-username').value.trim(),
        password: document.getElementById('user-password').value,
        email: document.getElementById('user-email').value.trim(),
        phone: document.getElementById('user-phone').value.trim(),
        role: role,
        residentType: residentType,
        flatId: flatId
      };

      try {
        await AuthApi.createUser(userData);
        Toast.success(`User created as ${role} ${residentType ? `(${residentType})` : ''} in database!`);
        Modal.close('new-user-modal');
        loadUsers();
      } catch (err) {
        // Handled with error toast
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['ADMIN'])) {
        Sidebar.render('sidebar-container', 'users');
        Navbar.render('navbar-container', 'User Management');
        loadUsers();
      }
    });
  </script>
</body>
</html>
