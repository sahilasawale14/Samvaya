<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Complaints Management — SAMVAYA Admin</title>
  <link rel="stylesheet" href="/css/main.css?v=3">
  <link rel="stylesheet" href="/css/dashboard.css?v=3">
  <link rel="stylesheet" href="/css/admin.css?v=3">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">Society Complaints & Redressal</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Track, assign staff, and resolve resident service tickets</p>
            </div>
          </div>
          <div id="complaints-data-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Update Complaint Modal -->
  <div class="modal-backdrop" id="update-complaint-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 style="font-size:18px;">Update Complaint Status</h3>
        <button onclick="Modal.close('update-complaint-modal')" class="btn-ghost">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="complaint-id-input">
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Status</label>
          <select id="complaint-status-select">
            <option value="ASSIGNED">ASSIGNED (In Progress)</option>
            <option value="IN_PROGRESS">IN_PROGRESS</option>
            <option value="RESOLVED">RESOLVED</option>
            <option value="CLOSED">CLOSED</option>
          </select>
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Assign Staff Member</label>
          <select id="complaint-staff-select">
            <option value="1">Santosh Jadhav (Electrician)</option>
            <option value="2">Ganesh More (Plumber)</option>
            <option value="3">Munna Lal (Gardener)</option>
            <option value="4">Ramesh Kumar (Security)</option>
          </select>
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Admin Remarks</label>
          <textarea id="complaint-remarks-input" rows="3" placeholder="Action taken or notes for resident..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('update-complaint-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="AdminPage.submitComplaintUpdate()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/components/toast.js?v=3"></script>
  <script src="/js/components/modal.js?v=3"></script>
  <script src="/js/components/sidebar.js?v=3"></script>
  <script src="/js/components/navbar.js?v=3"></script>
  <script src="/js/components/table.js?v=3"></script>
  <script src="/js/api/api.js?v=3"></script>
  <script src="/js/api/adminApi.js?v=3"></script>
  <script src="/js/pages/admin.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (checkAuth(['ADMIN'])) {
        AdminPage.initComplaints();
      }
    });
  </script>
</body>
</html>
