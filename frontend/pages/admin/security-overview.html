<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Overview — SAMVAYA Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar" id="sidebar-container"></aside>

    <main class="app-main">
      <header class="app-topbar" id="navbar-container"></header>

      <div class="content-body">
        <div class="card-section">
          <div class="card-header-flex">
            <div>
              <h2 class="card-title">Society Security Operations & Incident Logs</h2>
              <p style="font-size:13px; color:var(--on-surface-variant); margin-top:2px;">Gate security incidents, guard reports, and perimeter alerts</p>
            </div>
          </div>
          <div id="admin-incidents-table"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/api/api.js"></script>
  <script src="/js/api/adminApi.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (checkAuth(['ADMIN'])) {
        Sidebar.render('sidebar-container', 'security-overview');
        Navbar.render('navbar-container', 'Security Overview');
        const incidents = await AdminApi.getIncidents();
        Table.render('admin-incidents-table', [
          { label: 'Incident Type', render: r => `<b>${r.incidentType}</b>` },
          { label: 'Location', key: 'location' },
          { label: 'Description', key: 'description' },
          { label: 'Priority', render: r => `<span class="badge ${r.priority === 'HIGH' ? 'badge-danger' : 'badge-warning'}">${r.priority}</span>` },
          { label: 'Reported By', key: 'reportedByGuardName' },
          { label: 'Status', render: r => `<span class="badge ${r.status === 'RESOLVED' ? 'badge-success' : 'badge-warning'}">${r.status}</span>` },
          { label: 'Resolution Notes', render: r => r.resolutionNotes || 'Under investigation' }
        ], incidents);
      }
    });
  </script>
</body>
</html>
