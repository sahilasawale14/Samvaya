# ============================================================================
# SAMVAYA SOCIETY MANAGEMENT SYSTEM - SPRING BOOT CONFIGURATION
# ============================================================================

server.port=${PORT:8080}
server.servlet.context-path=/

# ----------------------------------------------------------------------------
# MySQL Database Connection (Cloud & Local Parameterized Configuration)
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:samvaya}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:Sahil@135678}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# CORS Configuration
# ----------------------------------------------------------------------------
cors.allowed-origins=*

# ----------------------------------------------------------------------------
# Hibernate & JPA Configuration
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ----------------------------------------------------------------------------
# Jackson JSON Formatting
# ----------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging.level.com.samvaya=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
